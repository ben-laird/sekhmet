# The full quality gate (format, lint, types, doc lint, JSR dry run, tests,
# coverage) on every pull request and every push to main. The gate set lives
# in scripts/ci (`deno task ci`); this workflow only provides the runner.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
          cache: true

      # Actions sets CI=true and GITHUB_ACTIONS=true, which scripts/ci detects:
      # CI output mode, coverage kept on disk (no cleanup step).
      - name: deno task ci
        run: deno task ci

      # Under CI=true the gate writes coverage to ./coverage (CI_COVERAGE_DIR in
      # scripts/ci/main.ts); local runs use a per-run temp dir instead.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: |
            coverage/html
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
