# Release on merge to main. Every push runs the full quality gate
# (`deno task ci`), then scripts/release/main.ts:
#
#   1. dv status       capture what is pending before Records are consumed
#   2. dv version       bump manifests, write CHANGELOGs, commit (if Records)
#   3. git push         put the chore(release) commit on main
#   4. dv release       tag, publish each package to JSR in dependency order,
#                       push the tags
#   5. gh release       one GitHub Release per tag that reached JSR
#
# With nothing pending and nothing untagged the run is a quick no-op.
# JSR auth is GitHub OIDC (id-token: write); every @sekhmet package is linked
# to this repository on jsr.io, so no token is stored.
#
# main is protected by the `Protect Main` ruleset: changes land through pull
# requests, and GITHUB_TOKEN cannot push to it. The bump commit and the tags
# are pushed with DV_PAT, the owner's fine-grained token (this repository
# only, `contents: write` and `workflows: write`), which has the ruleset's
# admin bypass. Unlike GITHUB_TOKEN pushes, PAT pushes trigger workflows:
#   - this one: the bump commit starts a `release` run that the job's `if:`
#     guard skips, so a release never recurses;
#   - ci.yml and compat.yml run on the bump commit, as on any push to main;
#   - docs.yml redeploys the site from the bump commit;
#   - compat-smoke.yml fires when each `release` run completes, but smokes
#     only after a successful one, so the skipped run adds nothing.
# No workflow triggers on tags or releases.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-run publishing for already-tagged versions (recovery after a failed publish)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only main: a manual run on another branch would push that branch to main
    # and publish it (scripts/release also refuses unless HEAD is main's tip).
    # startsWith, not contains: a squash merge can mention the prefix in its body.
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      # Third-party actions are SHA-pinned in this job, which holds write and
      # OIDC permissions; .github/dependabot.yml proposes the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # checkout persists this token for git, so `git push` and
          # `dv release --push` use it; GITHUB_TOKEN cannot push to main.
          token: ${{ secrets.DV_PAT }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
          cache: true

      # Never publish a red tree. The ruleset requires a green ci.yml before a
      # PR merges, but admins can bypass it and push straight to main, so run
      # the same gate again before any dv step.
      - name: Quality gate
        run: deno task ci

      # dv itself is pinned by scripts/dv/deno.json and deno.lock.
      - uses: ./.github/actions/setup-dv

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          # gh only views and creates GitHub Releases for tags already pushed
          # (scripts/release/main.ts); that is not a push to main, so the
          # job's `contents: write` GITHUB_TOKEN suffices and the PAT stays
          # with git alone. No workflow listens for release events.
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: deno run --frozen --allow-all scripts/release/main.ts $FORCE
