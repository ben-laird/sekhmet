name: Set up dv
description: Put the repo's pinned dv CLI (scripts/dv, `deno task dv`) on PATH as `dv`.

# The dv version is pinned exactly in scripts/dv/deno.json and its whole
# dependency tree in the committed deno.lock; --frozen fails the run rather
# than resolve anything new. The release driver calls `dv` by name, so the
# launcher goes on PATH. Run actions/checkout and setup-deno first.

runs:
  using: composite
  steps:
    - name: Install the dv launcher
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        cat > "$HOME/.local/bin/dv" <<EOF
        #!/bin/sh
        exec deno run --frozen --quiet --no-prompt --allow-all --config "$GITHUB_WORKSPACE/deno.json" "$GITHUB_WORKSPACE/scripts/dv/main.ts" "\$@"
        EOF
        chmod +x "$HOME/.local/bin/dv"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Check dv runs
      shell: bash
      run: dv --help > /dev/null
