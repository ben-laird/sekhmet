name: Set up dv
description: Put a pinned version of the dv CLI (jsr:@dv-cli/dv) on PATH.

# The documented `deno install jsr:@dv-cli/dv` does not work: the package's
# entry point (src/lib.ts) only re-exports `main`, so the installed binary
# exits 0 without running anything. The launcher calls the exported `main`
# instead. --no-config/--no-lock keep dv's own dependencies out of this
# repo's deno.json and deno.lock.

inputs:
  version:
    description: Exact @dv-cli/dv version to run.
    required: true

runs:
  using: composite
  steps:
    - name: Install the dv launcher
      shell: bash
      env:
        DV_VERSION: ${{ inputs.version }}
      run: |
        mkdir -p "$HOME/.local/bin"
        cat > "$HOME/.local/bin/dv" <<EOF
        #!/bin/sh
        exec deno eval --quiet --no-config --no-lock 'import { main } from "jsr:@dv-cli/dv@${DV_VERSION}"; Deno.exit(await main(Deno.args));' -- "\$@"
        EOF
        chmod +x "$HOME/.local/bin/dv"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Check dv runs
      shell: bash
      run: dv --help > /dev/null
